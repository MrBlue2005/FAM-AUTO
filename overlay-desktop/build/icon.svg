<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21070b"/>
      <stop offset="0.52" stop-color="#09090d"/>
      <stop offset="1" stop-color="#32070d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect x="44" y="44" width="936" height="936" rx="230" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="58" y="58" width="908" height="908" rx="216" fill="none" stroke="url(#edge)" stroke-width="18"/>
  <path d="M134 202C278 83 716 82 889 236" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="42" stroke-linecap="round"/>
  <g transform="skewX(-10)" filter="url(#glow)" font-family="Arial Black, Segoe UI, sans-serif" font-weight="900">
    <text x="167" y="665" font-size="410" fill="#ffffff" letter-spacing="-46">R</text>
    <text x="488" y="665" font-size="410" fill="#fecaca" letter-spacing="-46">X</text>
  </g>
  <g transform="rotate(-24 512 512)" filter="url(#glow)">
    <rect x="70" y="480" width="884" height="42" rx="21" fill="url(#slash)"/>
    <rect x="310" y="552" width="520" height="18" rx="9" fill="url(#slash)" opacity="0.78"/>
  </g>
  <circle cx="792" cy="742" r="20" fill="#fb7185" filter="url(#glow)"/>
</svg>
