name: Build offline Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard-v2/package-lock.json
            property-copywriter/package-lock.json
            overlay-desktop/package-lock.json

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build complete offline installer
        shell: powershell
        run: npm.cmd run installer:offline

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          $releaseUri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $releaseExists = $true
          try {
            Invoke-RestMethod -Uri $releaseUri -Headers $headers | Out-Null
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -eq 404) {
              $releaseExists = $false
            } else {
              throw
            }
          }

          if (-not $releaseExists) {
            gh release create $tag `
              --title "RX AI Studio $version" `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Nu am putut crea release-ul $tag." }
          }
          gh release upload $tag `
            "installer/dist/RX-AI-Studio-Offline-Setup-$version.exe" `
            "installer/dist/RX-AI-Studio-Offline-Setup-$version.exe.sha256" `
            "installer/dist/RX-AI-Studio-Offline-$version.zip" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Nu am putut incarca fisierele release-ului $tag." }

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: RX-AI-Studio-Offline
          path: |
            installer/dist/RX-AI-Studio-Offline-Setup-*.exe
            installer/dist/RX-AI-Studio-Offline-Setup-*.exe.sha256
            installer/dist/RX-AI-Studio-Offline-*.zip
          if-no-files-found: error
